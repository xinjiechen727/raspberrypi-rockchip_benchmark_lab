  function makeSlide(){const L=copy[lang];const tag=(s,n)=>`<div class="slide ${slideIndex===4?'method-slide':slideIndex===3?'quality-slide':slideIndex===1||slideIndex===2?'cpu-slide':''}">${slideHead(n)}<div class="slide-body">${s}</div>${foot(slideIndex===2||slideIndex===1?L.raceFoot:slideIndex===3?L.qualityFoot:slideIndex===4?L.footerRemark:L.warning)}</div>`;

  function initRace(){stopRace();if(slideIndex!==1&&slideIndex!==2)return;race={elapsed:0,running:false,speed:2,last:0};updateRace()}
  function updateRace(){if(!race)return;const L=copy[lang],first=DATA.pi,second=slideIndex===1?DATA.rk:DATA.mpp,elapsed=race.elapsed;
    [['pi',first],['second',second]].forEach(([key,d])=>{const x=Math.min(elapsed,d.time),p=Math.min(1,x/d.time),timer=document.getElementById('timer-'+key),bar=document.getElementById('bar-'+key),status=document.getElementById('status-'+key),count=document.getElementById('count-'+key);if(timer)timer.innerHTML=x.toFixed(2)+`<span class="unit">s</span>`;if(bar)bar.style.width=(p*100)+'%';if(status)status.textContent=p>=1?'✓ '+L.finished:L.active;if(count)count.textContent=Math.round(p*300)+' / 300';});
    const clock=document.getElementById('race-clock');if(clock)clock.textContent=L.elapsed+': '+elapsed.toFixed(1)+'s';
    const play=document.getElementById('race-play');if(play)play.textContent=race.running?'Ⅱ '+L.pause:elapsed>=DATA.pi.time?'↺ '+L.reset:'▶ '+L.run;
  }
  function raceFrame(ts){if(!race||!race.running)return;if(!race.last)race.last=ts;race.elapsed=Math.min(DATA.pi.time,race.elapsed+(ts-race.last)/1000*race.speed);race.last=ts;updateRace();if(race.elapsed>=DATA.pi.time){race.running=false;raf=0;updateRace();return}raf=requestAnimationFrame(raceFrame)}
  function stopRace(){cancelAnimationFrame(raf);raf=0;race=null}
  function toggleRace(){if(!race)return;if(race.elapsed>=DATA.pi.time)race.elapsed=0;race.running=!race.running;race.last=0;updateRace();if(race.running)raf=requestAnimationFrame(raceFrame);else cancelAnimationFrame(raf)}
  function resetRace(){if(!race)return;cancelAnimationFrame(raf);race.elapsed=0;race.running=false;race.last=0;updateRace()}
  function renderSlide(){stopRace();document.getElementById('screen').innerHTML=makeSlide();document.getElementById('presentCount').textContent=`${String(slideIndex+1).padStart(2,'0')} / 06`;initRace();resizeStage()}
  function resizeStage(){const root=document.getElementById('presentation');if(!root.classList.contains('active'))return;const isFull=document.fullscreenElement!==null;const availW=innerWidth-20,availH=innerHeight-(isFull?0:130)-8;screenScale=Math.min(availW/1600,availH/900);const vp=document.getElementById('viewport');vp.style.width=(screenScale*1600)+'px';vp.style.height=(screenScale*900)+'px';document.getElementById('screen').style.transform=`scale(${screenScale})`;document.querySelector('.present-top').style.display=isFull?'none':'flex';document.querySelector('.present-bottom').style.display=isFull?'none':'flex';}
  function show(){document.getElementById('presentation').classList.add('active');document.getElementById('presentation').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';slideIndex=0;renderSlide()}
  async function hide(){if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}document.getElementById('presentation').classList.remove('active');document.getElementById('presentation').setAttribute('aria-hidden','true');document.body.style.overflow='';stopRace()}
  function shift(delta){slideIndex=(slideIndex+delta+6)%6;renderSlide()}
  async function toggleFullscreen(){if(document.fullscreenElement){await document.exitFullscreen()}else{try{await document.getElementById('presentation').requestFullscreen()}catch(e){alert('Fullscreen was blocked; try F11 in your browser.')}}resizeStage()}
  function toggleLang(){lang=lang==='en'?'zh':'en';makeLanding();if(document.getElementById('presentation').classList.contains('active'))renderSlide()}
  document.addEventListener('click',event=>{const btn=event.target.closest('button');if(!btn)return;const a=btn.dataset.action;if(btn.id==='langButton'||a==='language')return toggleLang();if(btn.id==='presentButton'||a==='enter')return show();if(a==='exit')return hide();if(a==='prev')return shift(-1);if(a==='next')return shift(1);if(a==='fullscreen')return toggleFullscreen();if(a==='play')return toggleRace();if(a==='reset')return resetRace();});
  document.addEventListener('keydown',e=>{if(!document.getElementById('presentation').classList.contains('active'))return;if(['ArrowRight','ArrowLeft',' ','Escape','f','F'].includes(e.key)){e.preventDefault();if(e.key==='ArrowRight')shift(1);else if(e.key==='ArrowLeft')shift(-1);else if(e.key===' '&&(slideIndex===1||slideIndex===2))toggleRace();else if(e.key==='Escape'&&!document.fullscreenElement)hide();else if(e.key==='f'||e.key==='F')toggleFullscreen();}});
  document.addEventListener('fullscreenchange',resizeStage);window.addEventListener('resize',resizeStage);makeLanding();
})();
</script>
</body>
